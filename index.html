<html lang="ko">
<head>

<title>교화 자료</title>

<link rel="manifest" href="manifest.json">

<meta name="apple-mobile-web-app-capable" content="yes">

<body>
<style>
  :root{
    --bg:#eef1ee;
    --surface:#ffffff;
    --surface-2:#f4f6f3;
    --ink:#20282a;
    --ink-soft:#57625f;
    --ink-faint:#8a938e;
    --line:#dbe0da;
    --line-soft:#e7ebe4;
    --accent-blue:#2c4a6e;
    --accent-blue-soft:#e4ebf1;
    --accent-red:#a13a2f;
    --accent-red-soft:#f3e6e3;
    --shadow: 0 1px 2px rgba(28,36,34,.06), 0 6px 20px -12px rgba(28,36,34,.18);
    --radius: 12px;
    --radius-sm: 8px;
    --serif: 'Noto Serif KR', 'Nanum Myeongjo', serif;
    --sans: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14181a;
      --surface:#1b2123;
      --surface-2:#20272a;
      --ink:#e9e7df;
      --ink-soft:#a9b1ac;
      --ink-faint:#717977;
      --line:#2b3234;
      --line-soft:#252c2e;
      --accent-blue:#8ab0d8;
      --accent-blue-soft:#233241;
      --accent-red:#dd8a7c;
      --accent-red-soft:#3a2620;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14181a;
    --surface:#1b2123;
    --surface-2:#20272a;
    --ink:#e9e7df;
    --ink-soft:#a9b1ac;
    --ink-faint:#717977;
    --line:#2b3234;
    --line-soft:#252c2e;
    --accent-blue:#8ab0d8;
    --accent-blue-soft:#233241;
    --accent-red:#dd8a7c;
    --accent-red-soft:#3a2620;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  ::selection{ background:var(--accent-blue-soft); }

  /* ---------- taegeuk brand mark ---------- */
  .mark{
    width:22px; height:22px; flex:none;
    border-radius:50%;
    object-fit:cover;
    display:block;
  }

  /* ---------- header ---------- */
  header.app{
    position:sticky; top:0; z-index:40;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px) saturate(1.1);
    -webkit-backdrop-filter: blur(10px) saturate(1.1);
    border-bottom:1px solid var(--line);
  }
  .app-top{
    display:flex; align-items:center; gap:10px;
    padding:14px 16px 10px;
    max-width:640px; margin:0 auto;
  }
  .app-top h1{
    font-family:var(--serif);
    font-weight:700;
    font-size:19px;
    letter-spacing:.01em;
    margin:0;
    color:var(--ink);
  }
  .app-top .sub{
    font-size:11.5px;
    color:var(--ink-faint);
    margin-top:1px;
    letter-spacing:.02em;
  }
  .search-wrap{
    max-width:640px; margin:0 auto;
    padding:0 16px 10px;
  }
  .search-box{
    display:flex; align-items:center; gap:8px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:999px;
    padding:8px 14px;
  }
  .search-box svg{ flex:none; opacity:.55; }
  .search-box input{
    border:none; outline:none; background:transparent;
    font-family:var(--sans); font-size:14px; color:var(--ink);
    width:100%;
  }
  .search-box input::placeholder{ color:var(--ink-faint); }
  .search-clear{
    border:none; background:none; color:var(--ink-faint);
    font-size:16px; cursor:pointer; line-height:1; padding:2px;
    display:none;
  }
  .search-clear.show{ display:block; }

  nav.tabs{
    max-width:640px; margin:0 auto;
    display:flex; gap:4px;
    padding:0 12px;
    overflow-x:auto;
    scrollbar-width:none;
  }
  nav.tabs::-webkit-scrollbar{ display:none; }
  nav.tabs button{
    appearance:none; border:none; background:transparent;
    font-family:var(--sans); font-weight:500; font-size:13.5px;
    color:var(--ink-soft);
    padding:9px 13px 11px;
    white-space:nowrap;
    cursor:pointer;
    position:relative;
    border-radius:8px 8px 0 0;
  }
  nav.tabs button .dot{
    display:inline-block; width:6px; height:6px; border-radius:50%;
    background:var(--accent-blue); margin-right:6px;
    transform:translateY(-1px);
    opacity:0;
  }
  nav.tabs button[aria-selected="true"]{
    color:var(--ink);
    font-weight:700;
  }
  nav.tabs button[aria-selected="true"] .dot{ opacity:1; }
  nav.tabs button[aria-selected="true"]::after{
    content:"";
    position:absolute; left:10px; right:10px; bottom:0; height:2.5px;
    background:linear-gradient(90deg, var(--accent-blue), var(--accent-red));
    border-radius:2px 2px 0 0;
  }
  nav.tabs button:focus-visible{ outline:2px solid var(--accent-blue); outline-offset:2px; }

  /* ---------- main ---------- */
  main{
    max-width:640px; margin:0 auto;
    padding:18px 16px 64px;
  }
  .panel{ display:none; }
  .panel.active{ display:block; }
  .panel-search-label{
    display:none;
    font-family:var(--sans);
    font-weight:700;
    font-size:12px;
    letter-spacing:.04em;
    color:var(--ink-faint);
    text-transform:uppercase;
    margin:4px 2px 12px;
  }
  .panel-search-label.visible{ display:block; }

  .panel-intro{
    font-size:12.5px;
    color:var(--ink-faint);
    padding:2px 2px 16px;
    border-bottom:1px solid var(--line-soft);
    margin-bottom:16px;
    line-height:1.6;
  }

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:20px 18px 22px;
    margin-bottom:16px;
  }
  .card h2{
    font-family:var(--serif);
    font-weight:700;
    font-size:18px;
    line-height:1.4;
    margin:0 0 12px;
    color:var(--ink);
    text-wrap:balance;
    padding-bottom:10px;
    border-bottom:1px solid var(--line-soft);
  }
  .card h4{
    font-family:var(--sans);
    font-weight:700;
    font-size:13.5px;
    color:var(--accent-blue);
    margin:16px 0 6px;
    letter-spacing:.01em;
  }
  .card h4:first-of-type{ margin-top:4px; }
  .card p{
    font-size:15px;
    line-height:1.85;
    color:var(--ink);
    margin:0 0 10px;
    max-width:34em;
  }
  .card p.circ{
    padding-left:2px;
    color:var(--ink);
  }
  .card p.cite-tag{
    display:inline-block;
    font-family:var(--sans);
    font-weight:700;
    font-size:11px;
    letter-spacing:.03em;
    color:var(--accent-red);
    background:var(--accent-red-soft);
    padding:3px 9px;
    border-radius:999px;
    margin:6px 0 6px;
  }
  .card blockquote{
    margin:0 0 12px;
    padding:2px 0 2px 14px;
    border-left:2.5px solid var(--accent-red-soft);
    font-family:var(--serif);
    font-size:14.5px;
    line-height:1.85;
    color:var(--ink-soft);
  }
  .card figure{
    margin:12px 0 16px;
  }
  .card figure img{
    display:block;
    width:100%;
    height:auto;
    border-radius:var(--radius-sm);
    border:1px solid var(--line);
    cursor:zoom-in;
    background:var(--surface-2);
  }
  .card figure figcaption{
    font-size:11px;
    color:var(--ink-faint);
    text-align:center;
    margin-top:6px;
    letter-spacing:.02em;
  }
  .sprite-slide{
    position:relative;
    width:100%;
    overflow:hidden;
    border-radius:var(--radius-sm);
    border:1px solid var(--line);
    background:var(--surface-2);
    cursor:zoom-in;
  }
  .sprite-slide img{
    position:absolute;
    left:0; top:0;
    width:100%;
    display:block;
    pointer-events:none;
  }

  .empty-state{
    text-align:center;
    color:var(--ink-faint);
    font-size:13.5px;
    padding:40px 20px;
  }

  /* ---------- lightbox ---------- */
  .lightbox{
    position:fixed; inset:0; z-index:100;
    background:rgba(10,12,11,.92);
    display:none;
    padding:24px;
    overflow:auto;
    -webkit-overflow-scrolling:touch;
  }
  .lightbox.open{ display:block; }
  .lightbox img{
    display:block;
    width:100%;
    max-width:640px;
    height:auto;
    margin:0 auto;
    border-radius:6px;
    touch-action:pinch-zoom;
  }
  .lightbox-close{
    position:fixed; top:16px; right:16px; z-index:101;
    width:38px; height:38px; border-radius:50%;
    border:none; background:rgba(255,255,255,.12);
    color:#f2f0ea; font-size:20px; line-height:1;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    backdrop-filter:blur(6px);
  }

  footer.app{
    max-width:640px; margin:0 auto;
    padding:8px 16px 40px;
    text-align:center;
    color:var(--ink-faint);
    font-size:11px;
    letter-spacing:.02em;
  }

  @media (prefers-reduced-motion: no-preference){
    .card{ animation:rise .35s ease both; }
    @keyframes rise{ from{ opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
  }
  @media (prefers-reduced-motion: reduce){
    .card{ animation:none; }
  }
</style>

    <div>

  </div>
  <div class="search-wrap">

</header>

<main id="main"></main>

<footer class="app">개인 학습용 교화 자료 · 원본 HWPX 문서에서 정리</footer>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
  <button class="lightbox-close" id="lightboxClose" aria-label="닫기">×</button>
  <img id="lightboxImg" src="" alt="확대 이미지">
</div>

<script>
(function(){
  const main = document.getElementById('main');
  const tabNav = document.getElementById('tabNav');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const searchInput = document.getElementById('searchInput');
  const searchClear = document.getElementById('searchClear');

  const CITE_RE = /^[가-힣]{1,4}\d{1,3}-\d{1,3}$/;

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function renderItems(items){
    let html = '';
    let open = false;
    let i = 0;
    while (i < items.length){
      const it = items[i];
      if (it.t === 'title'){
        if (open) html += '</div>';
        html += '<div class="card">';
        html += '<h2>' + escapeHtml(it.v) + '</h2>';
        open = true;
      } else if (it.t === 'sub'){
        if (!open){ html += '<div class="card">'; open = true; }
        html += '<h4>' + escapeHtml(it.v) + '</h4>';
      } else if (it.t === 'circ'){
        if (!open){ html += '<div class="card">'; open = true; }
        html += '<p class="circ">' + escapeHtml(it.v) + '</p>';
      } else if (it.t === 'img'){
        if (!open){ html += '<div class="card">'; open = true; }
        const composite = 'images/composite_' + it.file + '.jpg';
        const padTop = (it.h / it.cw) * 100;      // aspect-ratio box height, as % of width
        const shiftPct = (it.y / it.ch) * 100;    // vertical shift, as % of the full-size image's own height
        html += '<div class="sprite-slide" style="padding-top:' + padTop.toFixed(3) + '%"'
              + ' data-composite="' + composite + '" data-y="' + it.y + '" data-ch="' + it.ch + '" data-h="' + it.h + '">'
              + '<img src="' + composite + '" alt="자료 이미지" loading="lazy" style="transform:translateY(-' + shiftPct.toFixed(3) + '%)">'
              + '</div>';
      } else if (it.t === 'p'){
        if (!open){ html += '<div class="card">'; open = true; }
        if (CITE_RE.test(it.v)){
          html += '<p class="cite-tag">' + escapeHtml(it.v) + '</p>';
          const next = items[i+1];
          if (next && next.t === 'p' && !CITE_RE.test(next.v)){
            html += '<blockquote>' + escapeHtml(next.v) + '</blockquote>';
            i++;
          }
        } else {
          html += '<p>' + escapeHtml(it.v) + '</p>';
        }
      }
      i++;
    }
    if (open) html += '</div>';
    return html;
  }

  // build panels
  CONTENT.forEach((tab, idx) => {
    const panel = document.createElement('div');
    panel.className = 'panel' + (idx === 0 ? ' active' : '');
    panel.id = 'panel-' + tab.id;
    panel.setAttribute('role', 'tabpanel');
    panel.innerHTML = '<div class="panel-search-label">' + escapeHtml(tab.label) + '</div>' + renderItems(tab.items);
    main.appendChild(panel);

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.setAttribute('role', 'tab');
    btn.setAttribute('aria-selected', idx === 0 ? 'true' : 'false');
    btn.dataset.target = tab.id;
    btn.innerHTML = '<span class="dot"></span>' + escapeHtml(tab.label);
    btn.addEventListener('click', () => {
      searchInput.value = '';
      switchTab(tab.id);
    });
    tabNav.appendChild(btn);
  });

  // tap a slide -> open the full sprite sheet in the lightbox, scrolled to that slide
  document.querySelectorAll('main .sprite-slide').forEach(slide => {
    slide.addEventListener('click', () => {
      const composite = slide.dataset.composite;
      const y = parseFloat(slide.dataset.y);
      const ch = parseFloat(slide.dataset.ch);
      const h = parseFloat(slide.dataset.h);

      const scrollToSlide = () => {
        requestAnimationFrame(() => {
          const renderedH = lightboxImg.clientHeight || (lightboxImg.naturalHeight * (lightboxImg.clientWidth / lightboxImg.naturalWidth));
          const scale = renderedH / ch;
          const targetTop = y * scale;
          const targetH = h * scale;
          const viewH = lightbox.clientHeight;
          lightbox.scrollTop = Math.max(0, targetTop - (viewH - targetH) / 2);
        });
      };

      if (lightboxImg.src.endsWith(composite) && lightboxImg.complete){
        lightbox.classList.add('open');
        scrollToSlide();
      } else {
        lightboxImg.onload = () => { lightbox.classList.add('open'); scrollToSlide(); };
        lightboxImg.src = composite;
      }
    });
  });

  function switchTab(id){
    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + id));
    document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.target === id ? 'true' : 'false'));
    window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
    applySearch();
  }

  document.getElementById('lightboxClose').addEventListener('click', () => lightbox.classList.remove('open'));
  lightbox.addEventListener('click', (e) => { if (e.target === lightbox) lightbox.classList.remove('open'); });

  // search: query matches across ALL tabs at once (not just the one currently open),
  // since the person searching doesn't know in advance which tab holds the answer
  function applySearch(){
    const q = searchInput.value.trim().toLowerCase();
    const searching = q.length > 0;
    searchClear.classList.toggle('show', searching);
    main.classList.toggle('searching', searching);

    let totalMatches = 0;
    document.querySelectorAll('.panel').forEach(panel => {
      const cards = panel.querySelectorAll('.card');
      let anyMatch = false;
      cards.forEach(card => {
        const text = card.textContent.toLowerCase();
        const match = !q || text.includes(q);
        card.style.display = match ? '' : 'none';
        if (match) anyMatch = true;
      });
      const label = panel.querySelector('.panel-search-label');
      if (searching){
        panel.style.display = anyMatch ? 'block' : 'none';
        if (label) label.classList.toggle('visible', anyMatch);
        if (anyMatch) totalMatches++;
      } else {
        panel.style.display = '';
        if (label) label.classList.remove('visible');
      }
    });

    let globalEmpty = document.getElementById('globalEmptyState');
    if (searching && totalMatches === 0){
      if (!globalEmpty){
        globalEmpty = document.createElement('div');
        globalEmpty.id = 'globalEmptyState';
        globalEmpty.className = 'empty-state';
        main.appendChild(globalEmpty);
      }
      globalEmpty.textContent = '"' + searchInput.value.trim() + '"에 대한 검색 결과가 없습니다.';
    } else if (globalEmpty){
      globalEmpty.remove();
    }
  }
  searchInput.addEventListener('input', applySearch);
  searchClear.addEventListener('click', () => { searchInput.value=''; applySearch(); searchInput.focus(); });
})();
</script>
